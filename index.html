<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cofre Blindado — Zero-Knowledge Vault</title>
  <meta name="theme-color" content="#0b0f19" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />

  <style>
    :root {
      --bg-main: #0b0f19;
      --card-bg: #131927;
      --card-border: #1e293b;
      --input-bg: #090d16;
      --accent-blue: #0284c7;
      --accent-blue-hover: #0369a1;
      --danger-red: #dc2626;
      --danger-red-hover: #b91c1c;
      --text-muted: #64748b;
      --text-light: #e2e8f0;
      --success-green: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-light); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 12px; }

    .view-screen { width: 100%; display: flex; justify-content: center; align-items: center; }
    .hidden { display: none !important; }

    /* AUTH CARD */
    .auth-card {
      background: linear-gradient(160deg, #131927, #0d121d);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
      text-align: center;
    }
    .shield-badge {
      width: 64px; height: 64px; background: rgba(2, 132, 199, 0.1); border: 1px solid rgba(2, 132, 199, 0.3);
      border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto;
      color: var(--accent-blue); font-size: 28px;
    }
    .auth-title { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .auth-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.4; }

    .input-label { display: block; text-align: left; font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.8px; margin-bottom: 8px; text-transform: uppercase; }
    .input-wrapper { position: relative; margin-bottom: 18px; }
    .input-field {
      width: 100%; padding: 12px 42px 12px 14px; background-color: var(--input-bg); border: 1px solid var(--card-border);
      border-radius: 10px; color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    .input-field:focus { border-color: var(--accent-blue); }
    .toggle-pwd { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; }

    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s;
    }
    .btn-primary { background: var(--accent-blue); color: #fff; box-shadow: 0 4px 16px rgba(2, 132, 199, 0.3); }
    .btn-primary:hover { background: var(--accent-blue-hover); }
    .btn-danger { background: var(--danger-red); color: #fff; box-shadow: 0 4px 16px rgba(220, 38, 38, 0.3); }
    .btn-danger:hover { background: var(--danger-red-hover); }

    .divider { display: flex; align-items: center; margin: 20px 0; color: var(--text-muted); font-size: 11px; font-weight: 600; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--card-border); }
    .divider span { padding: 0 10px; }

    .btn-secondary { background: #1a2333; border: 1px solid var(--card-border); color: var(--text-light); }
    .btn-secondary:hover { background: #222d42; }

    /* DASHBOARD */
    .app-container { display: flex; flex-direction: column; width: 100%; max-width: 520px; gap: 14px; margin: 0 auto; }

    .mobile-header-card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px;
      display: flex; flex-direction: column; gap: 12px;
    }

    .top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand-group { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .brand-icon {
      width: 36px; height: 36px; background: rgba(2, 132, 199, 0.12); border: 1px solid rgba(2, 132, 199, 0.3);
      border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--accent-blue); font-size: 16px;
    }
    .brand-info h2 { font-size: 14px; font-weight: 700; color: #fff; }
    .brand-info span { font-size: 10px; color: var(--success-green); display: flex; align-items: center; gap: 4px; }

    .btn-header-add {
      flex: 1;
      max-width: 160px;
      padding: 10px 12px;
      background: var(--accent-blue);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .nav-horizontal { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; align-items: center; }
    .nav-tab {
      background: var(--input-bg); border: 1px solid var(--card-border); padding: 8px 12px; border-radius: 8px;
      font-size: 12px; font-weight: 500; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 6px;
      white-space: nowrap; transition: 0.2s; flex: 1; justify-content: center;
    }
    .nav-tab.active { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; font-weight: 600; }
    
    .btn-lock-tab {
      background: rgba(220, 38, 38, 0.15); border: 1px solid rgba(220, 38, 38, 0.4); color: #f87171;
      padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 6px; white-space: nowrap; transition: 0.2s; margin-left: auto;
    }
    .btn-lock-tab:hover { background: var(--danger-red); color: #fff; }

    .main-content-card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }

    .search-box { position: relative; }
    .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 13px; }
    .search-input { width: 100%; padding: 10px 12px 10px 36px; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; color: #fff; font-size: 13px; outline: none; }

    .cards-list { display: flex; flex-direction: column; gap: 10px; max-height: 440px; overflow-y: auto; }
    .item-card { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .item-header { display: flex; align-items: center; justify-content: space-between; }
    .item-title-group { display: flex; align-items: center; gap: 10px; }
    .item-icon { width: 32px; height: 32px; background: rgba(2, 132, 199, 0.1); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--accent-blue); font-size: 14px; }
    .item-title h3 { font-size: 13px; font-weight: 600; color: #fff; }
    .item-title p { font-size: 11px; color: var(--text-muted); }

    .item-body { background: #05070c; padding: 8px 12px; border-radius: 6px; border: 1px solid #101623; display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
    .item-secret { letter-spacing: 2px; color: var(--text-muted); word-break: break-all; }
    .item-actions { display: flex; gap: 10px; }
    .action-icon { color: var(--text-muted); cursor: pointer; font-size: 13px; transition: color 0.2s; }
    .action-icon:hover { color: #fff; }

    .editor-modal { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .editor-textarea { width: 100%; min-height: 180px; padding: 10px; background: #05070c; border: 1px solid var(--card-border); border-radius: 6px; color: #fff; font-size: 13px; outline: none; resize: vertical; }

    /* FOOTER OPTIONS */
    .vault-footer-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; }
    .btn-sm-action { background: transparent; border: 1px solid var(--card-border); color: var(--text-muted); font-size: 11px; padding: 6px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .btn-sm-action:hover { color: #fff; border-color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- MASTER SETUP / UNLOCK SCREEN -->
  <div id="auth-screen" class="view-screen">
    <div class="auth-card">
      <div class="shield-badge"><i class="fa-solid fa-shield-halved"></i></div>
      <h1 class="auth-title" id="auth-title">Cofre Blindado</h1>
      <p class="auth-subtitle" id="auth-subtitle">Criptografia de nível militar Zero-Knowledge direta no seu navegador.</p>

      <div class="input-wrapper">
        <label class="input-label">CHAVE MESTRA</label>
        <input type="password" id="master-pwd" class="input-field" placeholder="Insira a sua senha mestra..." />
        <i class="fa-regular fa-eye-slash toggle-pwd" id="pwd-toggle" onclick="togglePasswordVisibility()"></i>
      </div>

      <button type="button" class="btn btn-primary" id="btn-auth" onclick="handleAuth()">
        <i class="fa-solid fa-lock-open"></i> Desbloquear Cofre
      </button>

      <div id="biometric-area" class="hidden">
        <div class="divider"><span>OU ACESSE COM</span></div>
        <button type="button" class="btn btn-secondary" onclick="unlockWithBiometrics()">
          <i class="fa-solid fa-fingerprint" style="color: var(--accent-blue);"></i> Biometria / Passkey
        </button>
      </div>
    </div>
  </div>

  <!-- DASHBOARD PRINCIPAL -->
  <div id="dashboard-screen" class="view-screen hidden">
    <div class="app-container">
      
      <div class="mobile-header-card">
        <div class="top-row">
          <div class="brand-group">
            <div class="brand-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <div class="brand-info">
              <h2>Cofre Blindado</h2>
              <span><i class="fa-solid fa-circle" style="font-size: 6px;"></i> AES-256 (RAM)</span>
            </div>
          </div>

          <button class="btn-header-add" onclick="addNewItem()">
            <i class="fa-solid fa-plus"></i> Novo Item
          </button>
        </div>

        <div class="nav-horizontal">
          <div class="nav-tab active" onclick="switchCategory('senhas', this)">
            <i class="fa-solid fa-key"></i> Senhas
          </div>
          <div class="nav-tab" onclick="switchCategory('notas', this)">
            <i class="fa-solid fa-sticky-note"></i> Notas
          </div>
          <div class="nav-tab" onclick="switchCategory('cartoes', this)">
            <i class="fa-solid fa-credit-card"></i> Cartões
          </div>

          <button class="btn-lock-tab" onclick="lockVault()">
            <i class="fa-solid fa-lock"></i> Bloquear
          </button>
        </div>
      </div>

      <div class="main-content-card">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" class="search-input" id="search-input" placeholder="Pesquisar itens guardados..." oninput="filterVaultItems()" />
        </div>

        <div class="cards-list" id="vault-list"></div>

        <div class="vault-footer-actions">
          <button class="btn-sm-action" onclick="exportEncryptedVault()"><i class="fa-solid fa-download"></i> Backup Backup Criptografado</button>
          <button class="btn-sm-action" onclick="registerBiometricPasskey()"><i class="fa-solid fa-fingerprint"></i> Configurar Biometria</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // CRIPTOGRAFIA ZERO-KNOWLEDGE (AES-GCM 256-bit + PBKDF2)
    let cryptoKey = null;
    let vaultItems = [];
    let currentCategory = 'senhas';
    let autoLockTimer = null;

    const PBKDF2_ITERATIONS = 600000;

    async function deriveKey(password, salt) {
      const encoder = new TextEncoder();
      const passwordBytes = encoder.encode(password);
      const baseKey = await crypto.subtle.importKey('raw', passwordBytes, 'PBKDF2', false, ['deriveKey']);
      return await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function encryptData(dataObj) {
      const encoder = new TextEncoder();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const jsonStr = JSON.stringify(dataObj);
      const encryptedContent = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv: iv },
        cryptoKey,
        encoder.encode(jsonStr)
      );
      return {
        iv: btoa(String.fromCharCode(...iv)),
        data: btoa(String.fromCharCode(...new Uint8Array(encryptedContent)))
      };
    }

    async function decryptData(encryptedObj) {
      const decoder = new TextDecoder();
      const iv = Uint8Array.from(atob(encryptedObj.iv), c => c.charCodeAt(0));
      const dataBytes = Uint8Array.from(atob(encryptedObj.data), c => c.charCodeAt(0));
      const decryptedContent = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv },
        cryptoKey,
        dataBytes
      );
      return JSON.parse(decoder.decode(decryptedContent));
    }

    // GESTÃO DE ESTADO DO COFRE
    function initApp() {
      const storedVault = localStorage.getItem('zk_vault_blob');
      if (!storedVault) {
        document.getElementById('auth-title').innerText = 'Criar Novo Cofre';
        document.getElementById('auth-subtitle').innerText = 'Defina uma Chave Mestra forte. Se a esquecer, os dados serão irrecuperáveis.';
        document.getElementById('btn-auth').innerHTML = '<i class="fa-solid fa-shield"></i> Criar Cofre Criptografado';
      } else {
        document.getElementById('biometric-area').classList.remove('hidden');
      }
    }

    async function handleAuth() {
      const pwd = document.getElementById('master-pwd').value;
      if (!pwd) return alert('Por favor, introduza a Chave Mestra.');

      const storedVault = localStorage.getItem('zk_vault_blob');

      if (!storedVault) {
        // Criar Cofre Inicial
        const salt = crypto.getRandomValues(new Uint8Array(16));
        cryptoKey = await deriveKey(pwd, salt);
        vaultItems = [
          { id: '1', category: 'senhas', title: 'Exemplo de Credencial', sub: 'usuario@email.com', secret: 'S3nh4_F0rt3!' },
          { id: '2', category: 'notas', title: 'Nota Segura', sub: 'Pessoal', secret: 'Esta é uma nota privada criptografada localmente.' }
        ];
        
        const encrypted = await encryptData(vaultItems);
        const vaultBlob = {
          salt: btoa(String.fromCharCode(...salt)),
          payload: encrypted
        };
        localStorage.setItem('zk_vault_blob', JSON.stringify(vaultBlob));
        openVault();
      } else {
        // Desbloquear Cofre
        try {
          const vaultBlob = JSON.parse(storedVault);
          const salt = Uint8Array.from(atob(vaultBlob.salt), c => c.charCodeAt(0));
          cryptoKey = await deriveKey(pwd, salt);
          vaultItems = await decryptData(vaultBlob.payload);
          openVault();
        } catch (e) {
          alert('Chave Mestra incorreta ou dados corrompidos!');
        }
      }
    }

    function openVault() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('dashboard-screen').classList.remove('hidden');
      document.getElementById('master-pwd').value = '';
      renderVaultList();
      resetAutoLock();
    }

    function lockVault() {
      cryptoKey = null;
      vaultItems = [];
      document.getElementById('dashboard-screen').classList.add('hidden');
      document.getElementById('auth-screen').classList.remove('hidden');
      clearTimeout(autoLockTimer);
    }

    function resetAutoLock() {
      clearTimeout(autoLockTimer);
      autoLockTimer = setTimeout(() => {
        lockVault();
        alert('Cofre bloqueado automaticamente por inatividade.');
      }, 300000); // 5 minutos
    }

    document.addEventListener('mousemove', resetAutoLock);
    document.addEventListener('keypress', resetAutoLock);

    // INTERFACE
    function switchCategory(cat, el) {
      currentCategory = cat;
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      if (el) el.classList.add('active');
      renderVaultList();
    }

    function renderVaultList(filter = '') {
      const container = document.getElementById('vault-list');
      container.innerHTML = '';

      const filtered = vaultItems.filter(i => 
        i.category === currentCategory && 
        (i.title.toLowerCase().includes(filter.toLowerCase()) || (i.sub && i.sub.toLowerCase().includes(filter.toLowerCase())))
      );

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); font-size: 12px; text-align: center; padding: 20px;">Nenhum registo encontrado.</p>';
        return;
      }

      filtered.forEach(item => {
        const iconClass = item.category === 'senhas' ? 'fa-key' : item.category === 'notas' ? 'fa-sticky-note' : 'fa-credit-card';
        container.insertAdjacentHTML('beforeend', `
          <div class="item-card">
            <div class="item-header">
              <div class="item-title-group">
                <div class="item-icon"><i class="fa-solid ${iconClass}"></i></div>
                <div class="item-title">
                  <h3>${item.title}</h3>
                  <p>${item.sub || ''}</p>
                </div>
              </div>
              <div class="item-actions">
                <i class="fa-regular fa-copy action-icon" onclick="copySecret('${item.secret}')" title="Copiar"></i>
                <i class="fa-regular fa-trash-can action-icon" onclick="deleteItem('${item.id}')" title="Eliminar"></i>
              </div>
            </div>
            <div class="item-body">
              <span class="item-secret" id="sec-${item.id}">••••••••••••</span>
              <i class="fa-regular fa-eye action-icon" onclick="toggleSecret('${item.id}', '${item.secret}')"></i>
            </div>
          </div>
        `);
      });
    }

    function filterVaultItems() {
      const query = document.getElementById('search-input').value;
      renderVaultList(query);
    }

    function toggleSecret(id, secret) {
      const el = document.getElementById(`sec-${id}`);
      if (el.innerText === '••••••••••••') {
        el.innerText = secret;
        el.style.color = '#fff';
      } else {
        el.innerText = '••••••••••••';
        el.style.color = 'var(--text-muted)';
      }
    }

    function copySecret(text) {
      navigator.clipboard.writeText(text);
      alert('Copiado com segurança para a área de transferência!');
    }

    async function addNewItem() {
      const title = prompt('Título:');
      if (!title) return;
      const sub = prompt('Subtítulo/Identificador:');
      const secret = prompt('Segredo/Senha/Conteúdo:');

      vaultItems.push({
        id: Date.now().toString(),
        category: currentCategory,
        title,
        sub,
        secret
      });

      await persistVault();
      renderVaultList();
    }

    async function deleteItem(id) {
      if (confirm('Eliminar este item permanentemente?')) {
        vaultItems = vaultItems.filter(i => i.id !== id);
        await persistVault();
        renderVaultList();
      }
    }

    async function persistVault() {
      const storedVault = JSON.parse(localStorage.getItem('zk_vault_blob'));
      const encrypted = await encryptData(vaultItems);
      storedVault.payload = encrypted;
      localStorage.setItem('zk_vault_blob', JSON.stringify(storedVault));
    }

    async function exportEncryptedVault() {
      const storedVault = localStorage.getItem('zk_vault_blob');
      const blob = new Blob([storedVault], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `cofre_backup_${Date.now()}.json`;
      a.click();
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('master-pwd');
      const icon = document.getElementById('pwd-toggle');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'fa-regular fa-eye toggle-pwd';
      } else {
        pwd.type = 'password';
        icon.className = 'fa-regular fa-eye-slash toggle-pwd';
      }
    }

    initApp();
  </script>
</body>
</html>
