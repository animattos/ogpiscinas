<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cofre Blindado</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#121212" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 16px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); text-align: center; }
    .shield-icon { font-size: 50px; margin-bottom: 16px; }
    h1 { font-size: 24px; color: #ffffff; margin-bottom: 8px; }
    p { font-size: 14px; color: #aaa; margin-bottom: 24px; }
    input { width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #444; background-color: #2a2a2a; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: #007bff; }
    button { width: 100%; padding: 14px; border-radius: 8px; border: none; background-color: #007bff; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
    button:hover { background-color: #0056b3; }
    .hidden { display: none !important; }
    .dashboard { text-align: left; }
    .vault-item { background: #2a2a2a; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .error { color: #ff5252; font-size: 13px; margin-top: 10px; }
    .btn-secondary { background-color: #444; margin-top: 10px; }
    .btn-secondary:hover { background-color: #555; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="login-screen" class="card">
    <div class="shield-icon">🛡️</div>
    <h1>Cofre Blindado</h1>
    <p>Digite sua senha mestre para desbloquear.</p>
    <form id="login-form">
      <input type="password" id="master-key" placeholder="Senha mestre (ex: 1234)" required />
      <button type="submit">Desbloquear Cofre</button>
    </form>
    <div id="login-error" class="error"></div>
  </div>

  <!-- TELA DO COFRE (DASHBOARD) -->
  <div id="dashboard-screen" class="card hidden dashboard">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1>🔐 Meu Cofre</h1>
      <button onclick="lockVault()" style="width: auto; padding: 8px 12px; background: #d32f2f; font-size: 12px;">Bloquear</button>
    </div>
    <p style="margin-bottom: 16px;">Seus dados estão protegidos localmente.</p>
    
    <div style="margin-bottom: 20px;">
      <input type="text" id="item-title" placeholder="Serviço / Site (ex: Banco)" style="margin-bottom: 8px;" />
      <input type="password" id="item-secret" placeholder="Senha ou Nota Secreta" style="margin-bottom: 8px;" />
      <button onclick="addItem()">Adicionar ao Cofre</button>
    </div>

    <h3 style="font-size: 16px; margin-bottom: 10px; color: #fff;">Itens Guardados:</h3>
    <div id="vault-list" style="max-height: 200px; overflow-y: auto;">
      <p style="color: #666; font-size: 13px; text-align: center;">Nenhum item guardado ainda.</p>
    </div>
  </div>

  <script>
    // Registo do Service Worker para PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
    }

    const MASTER_PASSWORD = "123"; // Senha padrão para teste

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const pwd = document.getElementById('master-key').value;
      if (pwd === MASTER_PASSWORD) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('dashboard-screen').classList.remove('hidden');
        loadVault();
      } else {
        document.getElementById('login-error').innerText = 'Senha incorreta! (Dica: 123)';
      }
    });

    function lockVault() {
      document.getElementById('master-key').value = '';
      document.getElementById('login-error').innerText = '';
      document.getElementById('dashboard-screen').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
    }

    function addItem() {
      const title = document.getElementById('item-title').value;
      const secret = document.getElementById('item-secret').value;
      if(!title || !secret) return alert('Preencha ambos os campos!');

      let vault = JSON.parse(localStorage.getItem('my_vault') || '[]');
      vault.push({ title, secret });
      localStorage.setItem('my_vault', JSON.stringify(vault));

      document.getElementById('item-title').value = '';
      document.getElementById('item-secret').value = '';
      loadVault();
    }

    function loadVault() {
      let vault = JSON.parse(localStorage.getItem('my_vault') || '[]');
      const listDiv = document.getElementById('vault-list');
      if (vault.length === 0) {
        listDiv.innerHTML = '<p style="color: #666; font-size: 13px; text-align: center;">Nenhum item guardado ainda.</p>';
        return;
      }
      listDiv.innerHTML = '';
      vault.forEach((item, index) => {
        listDiv.innerHTML += `
          <div class="vault-item">
            <div>
              <strong style="color: #fff; display:block;">${item.title}</strong>
              <span style="font-size: 12px; color: #888;">••••••••</span>
            </div>
            <button onclick="removeItem(${index})" style="width: auto; padding: 6px 10px; background: #444; font-size: 12px;">Excluir</button>
          </div>
        `;
      });
    }

    function removeItem(index) {
      let vault = JSON.parse(localStorage.getItem('my_vault') || '[]');
      vault.splice(index, 1);
      localStorage.setItem('my_vault', JSON.stringify(vault));
      loadVault();
    }
  </script>
</body>
</html>
