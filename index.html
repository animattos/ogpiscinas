<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cofre Blindado</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d0d0e" />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0d0d0e; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }

    .view-screen { width: 100%; display: flex; justify-content: center; align-items: center; }
    .hidden { display: none !important; }

    /* TELA DE LOGIN */
    .login-container {
      background: linear-gradient(145deg, #18191c, #121315);
      border: 1px solid #28292d;
      border-radius: 20px;
      padding: 36px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
      text-align: center;
    }
    .shield-badge {
      width: 68px; height: 68px; background: #141824; border: 1px solid #1f283e; border-radius: 18px;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; color: #2563eb; font-size: 30px;
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.15);
    }
    .login-title { font-size: 24px; font-weight: 700; color: #ffffff; margin-bottom: 6px; }
    .login-subtitle { font-size: 13px; color: #8e8f96; margin-bottom: 24px; }
    .input-label { display: block; text-align: left; font-size: 11px; font-weight: 700; color: #71727a; letter-spacing: 0.8px; margin-bottom: 8px; }
    .input-wrapper { position: relative; margin-bottom: 20px; }
    .input-field {
      width: 100%; padding: 14px 44px 14px 16px; background-color: #131417; border: 1px solid #28292d;
      border-radius: 10px; color: #fff; font-size: 15px; outline: none; transition: border-color 0.2s;
    }
    .input-field:focus { border-color: #2563eb; }
    .toggle-pwd { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #71727a; cursor: pointer; font-size: 15px; }
    .btn-primary {
      width: 100%; padding: 14px; background-color: #2563eb; border: none; border-radius: 10px;
      color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.35); transition: background-color 0.2s;
    }
    .btn-primary:hover { background-color: #1d4ed8; }
    .divider { display: flex; align-items: center; margin: 22px 0; color: #52535a; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #232428; }
    .divider span { padding: 0 10px; }
    .btn-biometric {
      width: 100%; padding: 14px; background-color: #181c26; border: 1px solid #232a3b; border-radius: 10px;
      color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background-color 0.2s;
    }
    .btn-biometric:hover { background-color: #1f2535; }
    .demo-hint { margin-top: 24px; font-size: 12px; color: #63646c; }
    .demo-hint strong { color: #a1a2a9; }

    /* DASHBOARD PRINCIPAL */
    .app-container { display: flex; width: 100%; max-width: 960px; gap: 16px; }
    .sidebar { width: 240px; background: #141518; border: 1px solid #232428; border-radius: 16px; padding: 20px 14px; display: flex; flex-direction: column; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid #232428; margin-bottom: 16px; }
    .brand-icon { width: 38px; height: 38px; background: #182033; border: 1px solid #23304d; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #2563eb; font-size: 18px; }
    .brand-info h2 { font-size: 14px; font-weight: 700; color: #fff; }
    .brand-info span { font-size: 11px; color: #10b981; display: flex; align-items: center; gap: 4px; }

    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .nav-item { padding: 12px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; color: #8e8f96; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.2s; }
    .nav-item:hover { color: #fff; background: #1a1b1f; }
    .nav-item.active { background: #2563eb; color: #fff; font-weight: 600; }

    .main-content { flex: 1; background: #141518; border: 1px solid #232428; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; min-width: 0; }
    .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
    .header-title h1 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .header-title p { font-size: 12px; color: #71727a; }

    .btn-add { padding: 10px 16px; background: #2563eb; border: none; border-radius: 10px; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3); }

    .search-box { position: relative; margin-bottom: 16px; }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #52535a; font-size: 14px; }
    .search-input { width: 100%; padding: 12px 14px 12px 40px; background: #111214; border: 1px solid #232428; border-radius: 10px; color: #fff; font-size: 13px; outline: none; }

    .cards-list { display: flex; flex-direction: column; gap: 12px; }
    .cred-card { background: #111214; border: 1px solid #232428; border-radius: 12px; padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .cred-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .avatar-icon { width: 40px; height: 40px; background: #1a2030; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #2563eb; font-weight: 700; font-size: 16px; flex-shrink: 0; }
    .cred-text h3 { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 2px; }
    .cred-text p { font-size: 12px; color: #71727a; }

    .cred-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .pwd-mask { background: #090a0b; padding: 6px 12px; border-radius: 6px; font-size: 12px; color: #8e8f96; letter-spacing: 2px; border: 1px solid #1c1d21; }
    .action-icon { color: #71727a; cursor: pointer; font-size: 14px; transition: color 0.2s; }
    .action-icon:hover { color: #fff; }

    @media (max-width: 768px) {
      body { padding: 10px; align-items: flex-start; }
      .app-container { flex-direction: column; gap: 12px; }
      .sidebar { width: 100%; padding: 12px 16px; }
      .nav-list { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
      .cred-actions { width: 100%; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid #1c1d21; }
    }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="login-screen" class="view-screen">
    <div class="login-container">
      <div class="shield-badge">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1 class="login-title">Cofre Blindado</h1>
      <p class="login-subtitle">Insira a sua chave mestra ou biometria para desbloquear</p>

      <div class="input-wrapper">
        <label class="input-label">CHAVE MESTRA</label>
        <input type="password" id="master-pwd" class="input-field" value="admin123" />
        <i class="fa-regular fa-eye-slash toggle-pwd" id="pwd-toggle" onclick="togglePasswordLogin()"></i>
      </div>

      <button type="button" class="btn-primary" onclick="tryLogin()">
        <i class="fa-solid fa-lock-open"></i> Desbloquear Cofre
      </button>

      <div class="divider">
        <span>OU ACESSE COM</span>
      </div>

      <button type="button" class="btn-biometric" onclick="tryLogin()">
        <i class="fa-solid fa-fingerprint" style="color: #2563eb; font-size: 18px;"></i> Biometria / FaceID
      </button>

      <p class="demo-hint">Senha padrão para demonstração: <strong>admin123</strong></p>
    </div>
  </div>

  <!-- DASHBOARD PRINCIPAL -->
  <div id="dashboard-screen" class="view-screen hidden">
    <div class="app-container">
      <!-- MENU LATERAL -->
      <div class="sidebar">
        <div class="brand">
          <div class="brand-icon">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <div class="brand-info">
            <h2>Cofre Blindado</h2>
            <span><i class="fa-solid fa-circle" style="font-size: 8px;"></i> AES-256 Protegido</span>
          </div>
        </div>

        <ul class="nav-list">
          <li class="nav-item active" onclick="switchTab('credenciais', this)"><i class="fa-solid fa-key"></i> Credenciais</li>
          <li class="nav-item" onclick="switchTab('notas', this)"><i class="fa-solid fa-sticky-note"></i> Notas Secretas</li>
          <li class="nav-item" onclick="switchTab('documentos', this)"><i class="fa-solid fa-folder"></i> Documentos</li>
          <li class="nav-item" onclick="lockVault()"><i class="fa-solid fa-right-from-bracket"></i> Bloquear</li>
        </ul>
      </div>

      <!-- CONTEÚDO PRINCIPAL -->
      <div class="main-content">
        <div class="header-area">
          <div class="header-title">
            <h1 id="sec-title">Gestor de Credenciais</h1>
            <p id="sec-subtitle">Guarde e gira as suas senhas em segurança</p>
          </div>
          <button class="btn-add" id="btn-add-item" onclick="addNewItem()"><i class="fa-solid fa-plus"></i> Nova Credencial</button>
        </div>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" class="search-input" id="search-input" placeholder="Pesquisar..." oninput="filterItems()" />
        </div>

        <div class="cards-list" id="items-list">
          <!-- Renderizado via JavaScript -->
        </div>
      </div>
    </div>
  </div>

  <!-- Input oculto estritamente para upload de imagens e PDFs -->
  <input type="file" id="file-selector" accept="image/*,application/pdf" style="display: none;" onchange="handleFileSelected(event)" />

  <script>
    let activeTab = 'credenciais';
    
    let vaultData = JSON.parse(localStorage.getItem('my_vault_data')) || {
      credenciais: [
        { id: 1, title: 'Conta Bancária', sub: 'usuario.silva', secret: 'Senha123!' },
        { id: 2, title: 'E-mail Principal', sub: 'contato@cofre.com', secret: 'OutraSenha99' }
      ],
      notas: [
        { id: 3, title: 'Ideias do App', sub: 'Nota Pessoal', secret: 'Lançar versão final esta semana.' }
      ],
      documentos: [
        { id: 4, title: 'Passaporte.pdf', sub: 'Documento PDF', fileData: '', isFile: true }
      ]
    };

    function saveData() {
      localStorage.setItem('my_vault_data', JSON.stringify(vaultData));
    }

    function togglePasswordLogin() {
      const field = document.getElementById('master-pwd');
      const icon = document.getElementById('pwd-toggle');
      if (field.type === 'password') {
        field.type = 'text';
        icon.className = 'fa-regular fa-eye toggle-pwd';
      } else {
        field.type = 'password';
        icon.className = 'fa-regular fa-eye-slash toggle-pwd';
      }
    }

    function tryLogin() {
      const pwd = document.getElementById('master-pwd').value;
      if (pwd === 'admin123') {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('dashboard-screen').classList.remove('hidden');
        renderList();
      } else {
        alert('Chave Mestra incorreta! Use: admin123');
      }
    }

    function lockVault() {
      document.getElementById('dashboard-screen').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('master-pwd').value = 'admin123';
    }

    function switchTab(tabName, element) {
      activeTab = tabName;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      if(element) element.classList.add('active');

      const titleEl = document.getElementById('sec-title');
      const subEl = document.getElementById('sec-subtitle');
      const btnEl = document.getElementById('btn-add-item');

      if (tabName === 'credenciais') {
        titleEl.innerText = 'Gestor de Credenciais';
        subEl.innerText = 'Guarde e gira as suas senhas em segurança';
        btnEl.innerHTML = '<i class="fa-solid fa-plus"></i> Nova Credencial';
      } else if (tabName === 'notas') {
        titleEl.innerText = 'Notas Secretas';
        subEl.innerText = 'Blocos de texto confidenciais protegidos';
        btnEl.innerHTML = '<i class="fa-solid fa-plus"></i> Nova Nota';
      } else if (tabName === 'documentos') {
        titleEl.innerText = 'Documentos';
        subEl.innerText = 'Guarde arquivos de imagens e PDFs com segurança';
        btnEl.innerHTML = '<i class="fa-solid fa-plus"></i> Novo Documento (PDF/Img)';
      }

      document.getElementById('search-input').value = '';
      renderList();
    }

    function renderList(filter = '') {
      const container = document.getElementById('items-list');
      container.innerHTML = '';

      let items = vaultData[activeTab] || [];
      if (filter) {
        items = items.filter(i => i.title.toLowerCase().includes(filter.toLowerCase()) || i.sub.toLowerCase().includes(filter.toLowerCase()));
      }

      if (items.length === 0) {
        container.innerHTML = '<p style="color: #666; font-size: 13px; text-align: center; padding: 20px;">Nenhum registo encontrado.</p>';
        return;
      }

      items.forEach((item) => {
        const initial = item.title.charAt(0).toUpperCase();
        
        if (activeTab === 'documentos') {
          // Renderização específica para documentos (Imagens e PDFs)
          container.insertAdjacentHTML('beforeend', `
            <div class="cred-card" id="card-${item.id}">
              <div class="cred-info">
                <div class="avatar-icon"><i class="fa-solid fa-file-arrow-down"></i></div>
                <div class="cred-text">
                  <h3>${item.title}</h3>
                  <p>${item.sub}</p>
                </div>
              </div>
              <div class="cred-actions">
                <i class="fa-regular fa-eye action-icon" onclick="openFile('${item.fileData}', '${item.title}')" title="Visualizar Ficheiro"></i>
                <i class="fa-solid fa-download action-icon" onclick="downloadFile('${item.fileData}', '${item.title}')" title="Descarregar"></i>
                <i class="fa-regular fa-trash-can action-icon" onclick="deleteItem(${item.id})" title="Eliminar"></i>
              </div>
            </div>
          `);
        } else {
          // Renderização padrão para Credenciais e Notas
          container.insertAdjacentHTML('beforeend', `
            <div class="cred-card" id="card-${item.id}">
              <div class="cred-info">
                <div class="avatar-icon">${initial}</div>
                <div class="cred-text">
                  <h3>${item.title}</h3>
                  <p>${item.sub}</p>
                </div>
              </div>
              <div class="cred-actions">
                <span class="pwd-mask" id="mask-${item.id}">••••••••••••</span>
                <i class="fa-regular fa-eye action-icon" onclick="toggleSecret(${item.id}, '${item.secret}')" title="Mostrar/Ocultar"></i>
                <i class="fa-regular fa-copy action-icon" onclick="copySecret('${item.secret}')" title="Copiar"></i>
                <i class="fa-regular fa-trash-can action-icon" onclick="deleteItem(${item.id})" title="Eliminar"></i>
              </div>
            </div>
          `);
        }
      });
    }

    function filterItems() {
      const val = document.getElementById('search-input').value;
      renderList(val);
    }

    function toggleSecret(id, secret) {
      const maskEl = document.getElementById(`mask-${id}`);
      if (maskEl.innerText === '••••••••••••') {
        maskEl.innerText = secret;
        maskEl.style.letterSpacing = 'normal';
        maskEl.style.color = '#10b981';
      } else {
        maskEl.innerText = '••••••••••••';
        maskEl.style.letterSpacing = '2px';
        maskEl.style.color = '#8e8f96';
      }
    }

    function copySecret(secret) {
      navigator.clipboard.writeText(secret).then(() => {
        alert('Segredo copiado para a área de transferência!');
      }).catch(() => {
        alert('Erro ao copiar.');
      });
    }

    function addNewItem() {
      if (activeTab === 'documentos') {
        // Dispara o seletor nativo de ficheiros restrito a PDF e imagens
        document.getElementById('file-selector').click();
      } else {
        const title = prompt('Título:');
        const sub = prompt('Subtítulo / Utilizador:');
        const secret = prompt('Segredo / Senha / Conteúdo:');

        if (title && secret) {
          const newItem = {
            id: Date.now(),
            title: title,
            sub: sub || 'Pessoal',
            secret: secret
          };
          vaultData[activeTab].push(newItem);
          saveData();
          renderList();
        }
      }
    }

    // Processa o arquivo selecionado (Imagem ou PDF)
    function handleFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const newItem = {
          id: Date.now(),
          title: file.name,
          sub: `${(file.size / 1024).toFixed(1)} KB • ${file.type.includes('pdf') ? 'PDF' : 'Imagem'}`,
          fileData: e.target.result,
          isFile: true
        };
        vaultData.documentos.push(newItem);
        saveData();
        renderList();
        event.target.value = ''; // Limpa o input
      };
      reader.readAsDataURL(file);
    }

    function openFile(base64Data, filename) {
      if (!base64Data) {
        alert('Este documento de exemplo padrão não possui conteúdo físico guardado. Adicione um novo ficheiro PDF ou imagem para testar a visualização.');
        return;
      }
      const win = window.open();
      win.document.write(`<iframe src="${base64Data}" frameborder="0" style="border:0; top:0; left:0; bottom:0; right:0; width:100%; height:100%;" allowfullscreen></iframe>`);
    }

    function downloadFile(base64Data, filename) {
      if (!base64Data) {
        alert('Documento de exemplo sem arquivo físico associado.');
        return;
      }
      const a = document.createElement('a');
      a.href = base64Data;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function deleteItem(id) {
      if (confirm('Tem certeza de que deseja eliminar este item?')) {
        vaultData[activeTab] = vaultData[activeTab].filter(i => i.id !== id);
        saveData();
        renderList();
      }
    }
  </script>
</body>
</html>
