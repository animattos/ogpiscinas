<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cofre Blindado</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#121212" />
  <meta name="description" content="Aplicação de Cofre Digital com Criptografia de Alta Segurança" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 16px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); text-align: center; }
    .shield-icon { font-size: 50px; margin-bottom: 16px; }
    h1 { font-size: 24px; color: #ffffff; margin-bottom: 8px; }
    p { font-size: 14px; color: #aaa; margin-bottom: 24px; }
    input { width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #444; background-color: #2a2a2a; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: #007bff; }
    button { width: 100%; padding: 14px; border-radius: 8px; border: none; background-color: #007bff; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
    button:hover { background-color: #0056b3; }
    .status { margin-top: 16px; font-size: 13px; color: #00e676; }
  </style>
</head>
<body>
  <div class="card">
    <div class="shield-icon">🛡️</div>
    <h1>Cofre Blindado</h1>
    <p>Acesse suas credenciais e documentos com segurança máxima.</p>
    <form id="vault-form">
      <input type="password" id="master-key" placeholder="Digite sua Chave Mestra" required />
      <button type="submit">Acessar Cofre</button>
    </form>
    <div id="status-msg" class="status"></div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
    }
    document.getElementById('vault-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const key = document.getElementById('master-key').value;
      if (key) { document.getElementById('status-msg').innerText = 'Autenticando e decodificando dados...'; }
    });
  </script>
</body>
</html>
