<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cofre Blindado Zero-Knowledge</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0284c7',
              600: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-cyan-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ICON COMPONENTS (SVG puro sem manipular o DOM) ---
    const IconShield = () => (<svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>);
    const IconLock = () => (<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>);
    const IconUnlock = () => (<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"/></svg>);
    const IconKey = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>);
    const IconPlus = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>);
    const IconEye = () => (<svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>);
    const IconEyeOff = () => (<svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.02 10.02 0 013.122-.563c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18"/></svg>);
    const IconFile = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>);
    const IconTrash = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>);
    const IconEdit = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>);
    const IconCopy = () => (<svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>);
    const IconDownload = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>);

    // --- CRYPTO ENGINE ---
    const PBKDF2_ITERATIONS = 600000;

    const bufToHex = buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    const hexToBuf = hex => new Uint8Array(hex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));

    async function deriveKey(masterPassword, saltHex) {
      const enc = new TextEncoder();
      const salt = hexToBuf(saltHex);
      const keyMaterial = await window.crypto.subtle.importKey(
        "raw",
        enc.encode(masterPassword),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      return await window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: PBKDF2_ITERATIONS,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptData(cryptoKey, plaintextObj) {
      const enc = new TextEncoder();
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const encodedData = enc.encode(JSON.stringify(plaintextObj));

      const ciphertext = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        cryptoKey,
        encodedData
      );

      return {
        ciphertextHex: bufToHex(ciphertext),
        ivHex: bufToHex(iv)
      };
    }

    async function decryptData(cryptoKey, ciphertextHex, ivHex) {
      const dec = new TextDecoder();
      const ciphertext = hexToBuf(ciphertextHex);
      const iv = hexToBuf(ivHex);

      const decrypted = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        cryptoKey,
        ciphertext
      );

      return JSON.parse(dec.decode(decrypted));
    }

    // --- MAIN APP ---
    function App() {
      const [vaultState, setVaultState] = useState('UNINITIALIZED');
      const [cryptoKey, setCryptoKey] = useState(null);
      const [vaultItems, setVaultItems] = useState([]);
      
      const [passwordInput, setPasswordInput] = useState('');
      const [confirmPasswordInput, setConfirmPasswordInput] = useState('');
      const [showMasterPass, setShowMasterPass] = useState(false);
      const [showConfirmPass, setShowConfirmPass] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [filterCategory, setFilterCategory] = useState('ALL');

      // Modal State
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [itemType, setItemType] = useState('PASSWORD'); // PASSWORD, NOTE, DOCUMENT
      const [itemName, setItemName] = useState('');
      const [itemUsername, setItemUsername] = useState('');
      const [itemPassword, setItemPassword] = useState('');
      const [showItemPass, setShowItemPass] = useState(false);
      const [itemNote, setItemNote] = useState('');
      const [fileData, setFileData] = useState(null); // { name, type, url }

      useEffect(() => {
        const storedSalt = localStorage.getItem('vault_salt');
        const storedVault = localStorage.getItem('vault_data');

        if (storedSalt && storedVault) {
          setVaultState('LOCKED');
        } else {
          setVaultState('UNINITIALIZED');
        }
      }, []);

      const handleSetupVault = async (e) => {
        e.preventDefault();
        setErrorMsg('');

        if (passwordInput.length < 8) {
          setErrorMsg('A senha mestra deve ter no mínimo 8 caracteres.');
          return;
        }
        if (passwordInput !== confirmPasswordInput) {
          setErrorMsg('As senhas não coincidem.');
          return;
        }

        try {
          const newSalt = bufToHex(window.crypto.getRandomValues(new Uint8Array(16)));
          const derivedKey = await deriveKey(passwordInput, newSalt);
          const initialData = [];
          const encrypted = await encryptData(derivedKey, initialData);

          localStorage.setItem('vault_salt', newSalt);
          localStorage.setItem('vault_data', JSON.stringify(encrypted));

          setCryptoKey(derivedKey);
          setVaultItems(initialData);
          setVaultState('UNLOCKED');
          setPasswordInput('');
          setConfirmPasswordInput('');
        } catch (err) {
          console.error(err);
          setErrorMsg('Erro ao inicializar o cofre.');
        }
      };

      const handleUnlockVault = async (e) => {
        e.preventDefault();
        setErrorMsg('');

        try {
          const storedSalt = localStorage.getItem('vault_salt');
          const encryptedRaw = localStorage.getItem('vault_data');
          if (!storedSalt || !encryptedRaw) return;

          const encryptedObj = JSON.parse(encryptedRaw);
          const derivedKey = await deriveKey(passwordInput, storedSalt);
          const decryptedData = await decryptData(derivedKey, encryptedObj.ciphertextHex, encryptedObj.ivHex);

          setCryptoKey(derivedKey);
          setVaultItems(decryptedData);
          setVaultState('UNLOCKED');
          setPasswordInput('');
        } catch (err) {
          console.error(err);
          setErrorMsg('Senha Mestra incorreta.');
        }
      };

      const lockVault = () => {
        setCryptoKey(null);
        setVaultItems([]);
        setVaultState('LOCKED');
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          setFileData({
            name: file.name,
            type: file.type,
            url: event.target.result
          });
        };
        reader.readAsDataURL(file);
      };

      const saveVaultItem = async () => {
        if (!itemName.trim()) {
          alert('Por favor, insira um nome para o item.');
          return;
        }

        const newItem = {
          id: editingItem ? editingItem.id : Date.now().toString(),
          type: itemType,
          name: itemName,
          username: itemUsername,
          password: itemPassword,
          note: itemNote,
          file: fileData,
          updatedAt: new Date().toISOString()
        };

        const updatedList = editingItem
          ? vaultItems.map(item => item.id === editingItem.id ? newItem : item)
          : [...vaultItems, newItem];

        try {
          const encrypted = await encryptData(cryptoKey, updatedList);
          localStorage.setItem('vault_data', JSON.stringify(encrypted));
          setVaultItems(updatedList);
          closeModal();
        } catch (err) {
          console.error(err);
          alert('Erro ao guardar o item.');
        }
      };

      const deleteVaultItem = async (id) => {
        if (!confirm('Remover este item?')) return;
        const updatedList = vaultItems.filter(item => item.id !== id);

        try {
          const encrypted = await encryptData(cryptoKey, updatedList);
          localStorage.setItem('vault_data', JSON.stringify(encrypted));
          setVaultItems(updatedList);
        } catch (err) {
          console.error(err);
          alert('Erro ao atualizar o cofre.');
        }
      };

      const openModal = (item = null) => {
        if (item) {
          setEditingItem(item);
          setItemType(item.type || 'PASSWORD');
          setItemName(item.name || '');
          setItemUsername(item.username || '');
          setItemPassword(item.password || '');
          setItemNote(item.note || '');
          setFileData(item.file || null);
        } else {
          setEditingItem(null);
          setItemType('PASSWORD');
          setItemName('');
          setItemUsername('');
          setItemPassword('');
          setItemNote('');
          setFileData(null);
        }
        setShowItemPass(false);
        setIsModalOpen(true);
      };

      const closeModal = () => {
        setIsModalOpen(false);
        setEditingItem(null);
      };

      const filteredItems = vaultItems.filter(item => {
        const matchesCategory = filterCategory === 'ALL' || item.type === filterCategory;
        const matchesSearch = (item.name || '').toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      if (vaultState === 'UNINITIALIZED') {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-md w-full shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-cyan-500/10 text-cyan-400 mb-2">
                  <IconShield />
                </div>
                <h1 className="text-2xl font-bold">Criar Cofre</h1>
              </div>

              {errorMsg && <div className="bg-red-500/10 border border-red-500/50 text-red-400 text-xs p-3 rounded-lg text-center">{errorMsg}</div>}

              <form onSubmit={handleSetupVault} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 uppercase mb-2">Senha Mestra</label>
                  <div className="relative">
                    <input
                      type={showMasterPass ? "text" : "password"}
                      required
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 pr-12"
                      value={passwordInput}
                      onChange={(e) => setPasswordInput(e.target.value)}
                    />
                    <button type="button" onClick={() => setShowMasterPass(!showMasterPass)} className="absolute right-3 top-3.5">
                      {showMasterPass ? <IconEyeOff /> : <IconEye />}
                    </button>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-300 uppercase mb-2">Confirmar Senha Mestra</label>
                  <div className="relative">
                    <input
                      type={showConfirmPass ? "text" : "password"}
                      required
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 pr-12"
                      value={confirmPasswordInput}
                      onChange={(e) => setConfirmPasswordInput(e.target.value)}
                    />
                    <button type="button" onClick={() => setShowConfirmPass(!showConfirmPass)} className="absolute right-3 top-3.5">
                      {showConfirmPass ? <IconEyeOff /> : <IconEye />}
                    </button>
                  </div>
                </div>

                <button type="submit" className="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold py-3 rounded-xl">
                  Criar Cofre Criptografado
                </button>
              </form>
            </div>
          </div>
        );
      }

      if (vaultState === 'LOCKED') {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-md w-full shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-cyan-500/10 text-cyan-400 mb-2">
                  <IconLock />
                </div>
                <h1 className="text-2xl font-bold">Cofre Bloqueado</h1>
              </div>

              {errorMsg && <div className="bg-red-500/10 border border-red-500/50 text-red-400 text-xs p-3 rounded-lg text-center">{errorMsg}</div>}

              <form onSubmit={handleUnlockVault} className="space-y-4">
                <div className="relative">
                  <input
                    type={showMasterPass ? "text" : "password"}
                    required
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 pr-12"
                    placeholder="Sua senha mestra"
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                  />
                  <button type="button" onClick={() => setShowMasterPass(!showMasterPass)} className="absolute right-3 top-3.5">
                    {showMasterPass ? <IconEyeOff /> : <IconEye />}
                  </button>
                </div>

                <button type="submit" className="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold py-3 rounded-xl flex items-center justify-center gap-2">
                  <IconUnlock /> Desbloquear Cofre
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
            <div className="flex items-center gap-3">
              <div className="bg-cyan-500/10 text-cyan-400 p-2 rounded-lg">
                <IconShield />
              </div>
              <h1 className="font-bold">Cofre Blindado</h1>
            </div>

            <div className="flex items-center gap-3">
              <button onClick={() => openModal()} className="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm flex items-center gap-2">
                <IconPlus /> Novo Item
              </button>
              <button onClick={lockVault} className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-4 py-2 rounded-xl text-sm border border-slate-700">
                Bloquear
              </button>
            </div>
          </header>

          <div className="flex-1 max-w-6xl w-full mx-auto p-6 space-y-6">
            <div className="flex flex-col sm:flex-row gap-4 justify-between items-center">
              <input
                type="text"
                placeholder="Pesquisar..."
                className="w-full sm:w-80 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
              />

              <div className="flex gap-2">
                {[
                  { id: 'ALL', label: 'Todos' },
                  { id: 'PASSWORD', label: 'Senhas' },
                  { id: 'NOTE', label: 'Notas' },
                  { id: 'DOCUMENT', label: 'Documentos' }
                ].map((cat) => (
                  <button
                    key={cat.id}
                    onClick={() => setFilterCategory(cat.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${
                      filterCategory === cat.id ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30' : 'bg-slate-900 text-slate-400'
                    }`}
                  >
                    {cat.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {filteredItems.map((item) => (
                <div key={item.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                  <div className="flex justify-between items-start">
                    <h3 className="font-bold text-slate-100 truncate">{item.name}</h3>
                    <div className="flex gap-2">
                      <button onClick={() => openModal(item)} className="text-slate-400 hover:text-slate-200"><IconEdit /></button>
                      <button onClick={() => deleteVaultItem(item.id)} className="text-slate-400 hover:text-red-400"><IconTrash /></button>
                    </div>
                  </div>

                  {item.username && <p className="text-xs text-slate-400 truncate"><b>Usuário:</b> {item.username}</p>}

                  {item.password && (
                    <div className="flex items-center justify-between bg-slate-950 px-3 py-2 rounded-lg border border-slate-800">
                      <span className="text-xs font-mono">{item.password}</span>
                      <button onClick={() => navigator.clipboard.writeText(item.password)} className="text-xs text-cyan-400 flex items-center gap-1">
                        <IconCopy /> Copiar
                      </button>
                    </div>
                  )}

                  {item.note && <p className="text-xs text-slate-400 bg-slate-950 p-2.5 rounded-lg border border-slate-800 whitespace-pre-wrap">{item.note}</p>}

                  {item.file && (
                    <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
                      <p className="text-xs text-slate-300 font-semibold truncate">{item.file.name}</p>
                      {item.file.type.startsWith('image/') ? (
                        <img src={item.file.url} alt="Ficheiro" className="w-full h-32 object-cover rounded-lg" />
                      ) : (
                        <a href={item.file.url} download={item.file.name} className="inline-flex items-center gap-1 text-xs text-cyan-400 hover:underline">
                          <IconDownload /> Baixar PDF
                        </a>
                      )}
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>

          {/* Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-lg w-full space-y-4">
                <h2 className="font-bold text-slate-100">{editingItem ? 'Editar Item' : 'Novo Item'}</h2>

                <div className="space-y-3">
                  <div>
                    <label className="block text-xs text-slate-400 uppercase mb-1">Tipo</label>
                    <select
                      value={itemType}
                      onChange={(e) => setItemType(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm"
                    >
                      <option value="PASSWORD">Senha / Conta</option>
                      <option value="NOTE">Nota Segura</option>
                      <option value="DOCUMENT">Documento (Imagem / PDF)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs text-slate-400 uppercase mb-1">Título</label>
                    <input
                      type="text"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm"
                      value={itemName}
                      onChange={(e) => setItemName(e.target.value)}
                    />
                  </div>

                  {itemType === 'PASSWORD' && (
                    <div>
                      <label className="block text-xs text-slate-400 uppercase mb-1">Senha</label>
                      <div className="relative">
                        <input
                          type={showItemPass ? "text" : "password"}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm pr-10"
                          value={itemPassword}
                          onChange={(e) => setItemPassword(e.target.value)}
                        />
                        <button type="button" onClick={() => setShowItemPass(!showItemPass)} className="absolute right-3 top-2.5">
                          {showItemPass ? <IconEyeOff /> : <IconEye />}
                        </button>
                      </div>
                    </div>
                  )}

                  {itemType === 'DOCUMENT' && (
                    <div>
                      <label className="block text-xs text-slate-400 uppercase mb-1">Anexar Ficheiro (Imagem ou PDF)</label>
                      <input
                        type="file"
                        accept="image/*,application/pdf"
                        onChange={handleFileUpload}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300"
                      />
                    </div>
                  )}

                  <div>
                    <label className="block text-xs text-slate-400 uppercase mb-1">Notas</label>
                    <textarea
                      rows="3"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm"
                      value={itemNote}
                      onChange={(e) => setItemNote(e.target.value)}
                    ></textarea>
                  </div>
                </div>

                <div className="flex justify-end gap-3 pt-3">
                  <button onClick={closeModal} className="px-4 py-2 text-sm text-slate-400">Cancelar</button>
                  <button onClick={saveVaultItem} className="px-4 py-2 text-sm font-bold bg-cyan-600 hover:bg-cyan-500 text-slate-950 rounded-xl">
                    Salvar
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
